<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Distribuciones Andinas - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error {
            color: red;
            font-size: 0.85em;
            display: block;
            margin-top: 2px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="bg-light pb-5">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-7 border border-1 p-4 mt-5 rounded-2 shadow-lg bg-white">
                <h2 class="text-center mb-4 text-primary fw-bold">Distribuciones Andinas S.A.S.</h2>
                <p class="text-center text-muted small mb-4">Formulario Oficial de Registro de Proveedores</p>

                <form id="formProveedores">

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="nombreEmpresa" placeholder="">
                    <label for="nombreEmpresa">Nombre de la empresa proveedora</label>
                    <span id="errNombre" class="error"></span>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="nit" placeholder="123456789-0">
                    <label for="nit">NIT (Ej: 123456789-0)</label>
                    <span id="errNit" class="error"></span>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="representante" placeholder="">
                    <label for="representante">Nombre del representante legal</label>
                    <span id="errorRepresentante" class="error"></span>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="email" placeholder="">
                    <label for="email">Correo electrónico</label>
                    <span id="errEmail" class="error"></span>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="telefono" placeholder="">
                    <label for="telefono">Teléfono</label>
                    <span id="errorTelefono" class="error"></span>
                </div>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="direccion" placeholder="">
                    <label for="direccion">Dirección</label>
                    <span id="errorDireccion" class="error"></span>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="ciudad" placeholder="">
                    <label for="ciudad">Ciudad</label>
                    <span id="errorCiudad" class="error"></span>
                </div>

                <div class="input-group mb-1">
                    <label class="input-group-text" for="tipoProveedor">Tipo de Proveedor</label>
                    <select class="form-select" id="tipoProveedor">
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="Natural">Persona Natural</option>
                        <option value="Jurídica">Persona Jurídica</option>
                    </select>
                </div>
                <span id="errTipo" class="error"></span>

                <div class="input-group mb-1 mt-2">
                    <label class="input-group-text" for="fechaVinculacion">Fecha de Vinculación</label>
                    <input type="date" class="form-control" id="fechaVinculacion">
                </div>
                <span id="errorFecha" class="error"></span>

                <div class="input-group mb-1 mt-2">
                    <label class="input-group-text" for="docPDF">Documento PDF</label>
                    <input type="file" class="form-control" id="docPDF" accept=".pdf">
                </div>
                <span id="errPdf" class="error"></span>

                <div class="input-group mb-3 mt-2">
                    <label class="input-group-text" for="logoEmpresa">Logotipo / Foto</label>
                    <input type="file" class="form-control" id="logoEmpresa" accept=".png, .jpg, .jpeg">
                </div>
                <span id="errLogo" class="error"></span>

                <button type="submit" class="btn btn-outline-success w-100 fw-bold py-2 mt-2">Registrar Proveedor</button>

                </form>
            </div>
        </div>

        <div class="row d-flex justify-content-center mt-5">
            <div class="col-12 border border-1 p-4 rounded-2 shadow bg-white">
                <h4 class="mb-3 text-secondary">Base de Datos de Proveedores Registrados</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="tablaProveedores">
                        <thead class="table-dark">
                            <tr>
                                <th>Empresa</th>
                                <th>NIT</th>
                                <th>Representante</th>
                                <th>Contacto</th>
                                <th>Ubicación</th>
                                <th>Tipo</th>
                                <th>Archivos Adjuntos</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

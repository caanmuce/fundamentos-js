<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
  <script src="promedio.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f7fc 0%, #d4e0ff 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(17, 24, 39, 0.12);
      padding: 28px 32px;
    }

    .form-card h1 {
      margin: 0 0 18px;
      font-size: 1.75rem;
      color: #1f2937;
      margin-left: 80px;
    }

    .mb-3 {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.98rem;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      background: #ffffff;
    }

    .form-text {
      margin-top: 8px;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-check-input {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
    }

    .form-check-label {
      color: #334155;
      font-size: 0.97rem;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      border: 1px solid #19aa66;
      background-color: #ffffff;
      color: #19aa66;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.22);
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h1>Ingrese las notas</h1>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" id="nota1"  placeholder="primera nota">
      </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="nota2"  placeholder="segunda nota">
        </div>
        <div class="mb-3">
        <input type="text" class="form-control" id="nota3"  placeholder="tercera nota">
      </div>
      <button type="submit" class="btn-primary">Enviar</button>
    </form>
  </main>
</body>
</html>
